spring.application.name=fairshare

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/fairshare
spring.datasource.username=fairshare
spring.datasource.password=fairshare_dev_password

# --- JPA ---
# validate: Hibernate checks the schema matches the entities but never changes it.
# Flyway owns the schema. Never use ddl-auto=update outside a throwaway prototype.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator ---
management.endpoints.web.exposure.include=health,info   